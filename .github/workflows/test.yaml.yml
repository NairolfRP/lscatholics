name: Test

permissions:
  contents: read

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - v2
      - dev
      - staging
      - prod

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Lint
        run: pnpm lint

      - name: Run Format Check
        run: pnpm format --check

      - name: Run Type-Check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
