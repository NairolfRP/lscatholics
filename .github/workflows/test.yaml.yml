name: Test

permissions:
  contents: read

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - dev
      - staging
      - prod

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: 'pnpm'

      - name: Allow sqlite3 build (CI Only)
        run: |
          npm pkg set 'pnpm.onlyBuiltDependencies[]=sqlite3'
          npm pkg set 'pnpm.onlyBuiltDependencies[]=@libsql/sqlite3'
          npm pkg set 'pnpm.onlyBuiltDependencies[]=better-sqlite3'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Format Check
        run: pnpm format --check

      - name: Run Type-Check
        run: pnpm typecheck

      - name: Tests
        run: |
          mkdir -p tmp
          rm -f tmp/test.db
          node ace migration:run --force
          pnpm test
        env:
          NODE_ENV: test
          HOST: 0.0.0.0
          TURSO_DATABASE_URL: tmp/test.db
