name: Test

permissions:
  contents: read

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - dev
      - prod

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Linting, Formatting and Typing
        run: bun run check

      - name: Install Playwright deps
        run: bunx playwright install --with-deps

      - name: Testing
        run: bun run test

      - name: Build
        run: bun run build
