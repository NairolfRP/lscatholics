name: Discord Changeset Notification

on:
    push:
        branches:
            - prod

jobs:
    discord-notification:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Install jq
              run: sudo apt-get install -y jq

            - name: Get commit messages
              id: get-commits
              run: |
                  COMMITS=$(git log --pretty=format:"- %h %s" $(git merge-base HEAD~1 HEAD)..HEAD)
                  COMMITS_JSON=$(echo "$COMMITS" | jq -Rs .)
                  COMMITS_JSON="${COMMITS_JSON:1:-1}"
                  COMMITS_JSON="${COMMITS_JSON//\\/\\\\}"
                  echo "commits<<EOF" >> $GITHUB_OUTPUT
                  echo "$COMMITS_JSON" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Prepare variables
              id: vars
              run: |
                  echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT
                  echo "FORMATTED_DATE=$(date '+%d/%m/%Y à %H:%M')" >> $GITHUB_OUTPUT

            - name: Send Discord notification
              uses: Ilshidur/action-discord@master
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  DISCORD_USERNAME: "[HRP] Site - Mise à jour"
                  DISCORD_AVATAR: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                  DISCORD_EMBEDS: |
                      [
                        {
                          "title": "📦 Nouvelle mise à jour",
                          "description": "Un push a été effectué sur la branche **prod**\n⚠️ **La mise à jour sera disponible en ligne après la fin du déploiement manuel dans quelques minutes.**",
                          "color": 15105570,
                          "fields": [
                            {
                              "name": "📝 Changements",
                              "value": "${{ steps.get-commits.outputs.commits }}",
                              "inline": false
                            },
                            {
                              "name": "👤 Auteur",
                              "value": "${{ github.actor }}",
                              "inline": true
                            },
                            {
                              "name": "🔄 Commit",
                              "value": "[${{ steps.vars.outputs.SHORT_SHA }}](${{ github.event.repository.html_url }}/commit/${{ github.sha }})",
                              "inline": true
                            },
                            {
                              "name": "🧪 Voir les changements",
                              "value": "[Comparer](${{ github.event.repository.html_url }}/compare/${{ github.event.before }}...${{ github.sha }})",
                              "inline": true
                            }
                          ],
                          "thumbnail": {
                            "url": "https://avatars.githubusercontent.com/${{ github.actor }}"
                          },
                          "footer": {
                            "text": "Push effectué le ${{ steps.vars.outputs.FORMATTED_DATE }}",
                            "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                          }
                        }
                      ]
              with:
                  args: ""
