strictPeerDependencies: true
engineStrict: true
allowBuilds:
  esbuild: true
  '@libsql/sqlite3': true
  '@swc/core': true
  better-sqlite3: true
  lightningcss: true
  msw: true
overrides:
  "@tailwindcss/typography>tailwindcss": "$tailwindcss"
minimumReleaseAgeExclude:
  - '@inertiajs/core@2.3.24'
  - '@inertiajs/react@2.3.24'
