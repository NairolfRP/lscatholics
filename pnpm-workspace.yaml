engineStrict: true
minimumReleaseAge: 1440 # 1 day
autoInstallPeers: true
strictPeerDependencies: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - '@types/node'
  - 'typescript'
  - 'react'
  - 'react-dom'
  - '@gtaw-oauth-providers/better-auth@2.2.1-next.1 || 2.2.1'
  - '@better-auth/core@1.7.0'
  - '@better-auth/drizzle-adapter@1.7.0'
  - '@better-auth/kysely-adapter@1.7.0'
  - '@better-auth/memory-adapter@1.7.0'
  - '@better-auth/mongo-adapter@1.7.0'
  - '@better-auth/prisma-adapter@1.7.0'
  - '@better-auth/telemetry@1.7.0'
  - better-auth@1.7.0
  - '@better-auth/i18n@1.7.0'
allowBuilds:
  esbuild: true
