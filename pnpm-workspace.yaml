    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - '@types/node'
  - 'typescript'
  - 'react'
  - 'react-dom'
  - '@gtaw-oauth-providers/better-auth@2.2.1-next.1 || 2.2.1'
  - '@better-auth/core@1.7.0'
  - '@better-auth/drizzle-adapter@1.7.0'
  - '@better-auth/kysely-adapter@1.7.0'
  - '@better-auth/memory-adapter@1.7.0'
  - '@better-auth/mongo-adapter@1.7.0'
  - '@better-auth/prisma-adapter@1.7.0'
  - '@better-auth/telemetry@1.7.0'
  - better-auth@1.7.0
  - '@better-auth/i18n@1.7.0'
  - '@tanstack/react-router@1.170.32'
  - '@tanstack/react-start-client@1.168.30'
  - '@tanstack/react-start-rsc@0.1.48'
  - '@tanstack/react-start-server@1.167.37'
  - '@tanstack/react-start@1.168.49'
  - '@tanstack/router-core@1.171.27'
  - '@tanstack/router-generator@1.167.33'
  - '@tanstack/router-plugin@1.168.35'
  - '@tanstack/start-client-core@1.170.27'
  - '@tanstack/start-plugin-core@1.171.39'
  - '@tanstack/start-server-core@1.169.31'
  - '@tanstack/start-storage-context@1.167.29'
  - '@tanstack/router-cli@1.167.33'
  - '@tanstack/query-core@5.102.2'
