engineStrict: true
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  unrs-resolver: true
  better-sqlite3: true
  '@libsql/client': true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - react@19.2.8
  - react-dom@19.2.8
