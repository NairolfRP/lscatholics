engineStrict: true
minimumReleaseAge: 1440 # 1 day
autoInstallPeers: true
strictPeerDependencies: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - '@types/node'
  - 'typescript'
  - 'react'
  - 'react-dom'
  - '@gtaw-oauth-providers/better-auth@2.2.1-next.1'
allowBuilds:
  esbuild: true
