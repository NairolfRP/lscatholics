engineStrict: true
minimumReleaseAge: 1440 # 1 day
autoInstallPeers: true
strictPeerDependencies: false
packageExtensions:
  drizzle-kit:
    peerDependencies:
      drizzle-orm: '*'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - '@types/node'
  - 'typescript'
  - 'react'
  - 'react-dom'
allowBuilds:
  '@sentry/cli': true
  esbuild: true
permissions:
  '@tanstack/devtools-vite':
    skills: true
  '@tanstack/match-sorter-utils':
    skills: true
  '@tanstack/react-router':
    skills: true
  '@tanstack/react-start':
    skills: true
  '@tanstack/react-table':
    skills: true
  '@tanstack/router-plugin':
    skills: true
  drizzle-kit:
    skills: true
